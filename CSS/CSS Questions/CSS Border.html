<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border</title>
    <style>
        div {
            border: 1px solid black;
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <div>
        <h1>This is a heading.</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat nisi, alias accusantium animi facilis dicta
            pariatur maxime cumque odio! Odio tenetur blanditiis non velit voluptatibus atque libero excepturi error
            quos!</p>
    </div>
</body>

</html>
