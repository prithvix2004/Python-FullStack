<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery - Effects (toggle() Method)</title>
</head>

<body>
    <p id="myPara">This is a paragraph.</p>
    <button id="toggleBtn">Toggle Visibility</button>

    <script src="jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#toggleBtn").click(function () {
                $("#myPara").toggle();  //Toggles the visibility of the paragraph.
            });
        });
    </script>
</body>

</html>
