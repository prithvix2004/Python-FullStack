<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery - Effects (hide() and show() Methods)</title>
</head>

<body>
    <p id="myPara">This is a paragraph.</p>
    <button id="hide">Hide</button>
    <button id="show">Show</button>

    <script src="jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#hide").click(function () {
                $("#myPara").hide();  //Hides the paragraph.
            });
            $("#show").click(function () {
                $("#myPara").show();  //Shows the paragraph.
            });
        });
    </script>
</body>

</html>
