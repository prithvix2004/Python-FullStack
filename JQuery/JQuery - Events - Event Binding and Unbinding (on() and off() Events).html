<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery On and Off Events</title>
</head>

<body>
    <button id="bindBtn">Bind Click Event</button>
    <button id="unbindBtn">Unbind Click Event</button>
    <p>Click Me!</p>

    <script src="jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#bindBtn").click(function () {
                $("p").on("click", function () {
                    $(this).text("Paragraph Clicked!")
                });
            });
            $("#UnbindBtn").click(function () {
                $("p").off("click");    //Removes the click event handler from the paragraph.
            });
        });
    </script>
</body>

</html>
