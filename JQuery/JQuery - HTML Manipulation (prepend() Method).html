<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery - HTML Manipulation (prepend() Method)</title>
</head>

<body>
    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
    </ul>
    <button id="prependItem">Prepend Item</button>

    <script src="jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#prependItem").click(function () {
                $("#myList").append("<li>New First Item</li>");   //Prepends new item to the start of the list.
            });
        });
    </script>
</body>

</html>
