<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery - Effects (slideDown() and slideUp() Methods)</title>
</head>

<body>
    <p id="myPara" style="display: none;">This is a paragraph.</p>
    <button id="slideDown">Slide Down</button>
    <button id="slideUp">Slide Up</button>

    <script src="jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#slideDown").click(function () {
                $("#myPara").slideDown();  //Slides down paragraph.
            });
            $("slideUp").click(function () {
                $("#myPara").slideUp();  //Slides up paragraph.
            });
        });
    </script>
</body>

</html>
