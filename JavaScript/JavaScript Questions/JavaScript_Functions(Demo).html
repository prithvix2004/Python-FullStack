<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Functions Demo</title>
</head>

<body>
       <script>
              function max(x, y) {
                     return x > y ? x : y; //terinary operators       condition ? true : false
              }
              //calling the function
              x = 15;
              y = 11;
              document.writeln("<h1>Larger of " + x + " and " + y + " is :" + max(x, y));
       </script>
</body>

</html>
