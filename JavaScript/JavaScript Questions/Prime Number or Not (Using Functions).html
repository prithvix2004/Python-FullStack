<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime or Not (Using Functions)</title>
</head>

<body>
    <h3>Check the value is prime or not..</h3>;
    <button onclick="isPrime()">Prime or Not</button>
    <script>
        function isPrime() {
            var a = parseInt(prompt("Enter a number : "));
            var count = 0;
            var i = 1;
            while (i <= a) {
                if (a % i == 0) {
                    count += 1;
                }
                i++;
                if (count == 2) {
                    document.writeln("Prime..");
                }
                else {
                    document.writeln("Not Prime..");
                }
            }
        }
    </script>
</body>

</html>
