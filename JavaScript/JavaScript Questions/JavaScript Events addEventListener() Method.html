<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>JavaScript Events addEventListener() Method</title>
</head>

<body>
       <p>Example of the addEventListener() Method</p>
       <p>Click the following button to see the effect.</p>
       <button id="btn">Click Me</button>
       <p id="para"></p>
</body>

<script>
       document.getElementById("btn").addEventListener("click", fun);
       function fun() {
              document.getElementById("para").innerHTML = "Welcome to G - Tec Computer Education" + "<br>" + "Learn JavaScript from G - Tec";
       }
</script>

</html>
