<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area and Perimeter of Rectangle</title>
</head>

<body>
    <script>
        var l = parseInt(prompt("Enter length : "));
        var b = parseInt(prompt("Enter breadth : "));
        var area = l * b;
        var perimeter = 2 * (l + b);
        document.writeln("Area", area, "<br>");
        document.writeln("Perimeter", perimeter, "<br>");
    </script>
</body>

</html>
