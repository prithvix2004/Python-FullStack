<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Even Numbers</title>
</head>

<body>
    <script>
        var i = 2;
        var sum = 0;
        while (i <= 10) {
            sum += i;
            i += 2;
        }
        document.writeln(sum);
    </script>
</body>

</html>
