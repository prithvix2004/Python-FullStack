<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celsius to Fahrenheit Conversion</title>
</head>

<body>
    <script>
        var c = parseFloat(prompt("Enter Celsius : "));
        var f = (c * (9 / 5)) + 32;
        document.writeln("Fahrenheit : ", f, "<br>");
    </script>
</body>

</html>
