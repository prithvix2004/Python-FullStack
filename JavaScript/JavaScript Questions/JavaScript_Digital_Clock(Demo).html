<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>JavaScript Digital Clock (Demo)</title>
</head>

<body>
       <h1 align="centre">Current Time : <span id="clock"></span></h1>
       <script>
              function getTime() {
                     var today = new Date();
                     var h = today.getHours();
                     var m = today.getMinutes();
                     var s = today.getSeconds();
                     document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;
              }
              setInterval("getTime()", 1000);
       </script>
</body>

</html>
