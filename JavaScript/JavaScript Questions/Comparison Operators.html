<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison Operators</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a number : "));
        var b = parseInt(prompt("Enter a number : "));
        var equalto = a == b;
        var notequalto = a != b;
        var greaterthan = a > b;
        var greaterthanorequalto = a >= b;
        var lessthan = a < b;
        var lessthanorequalto = a <= b;
        document.writeln("Equal to : ", equalto, "<br>");
        document.writeln("Not equal to : ", notequalto, "<br>");
        document.writeln("Greater than : ", greaterthan, "<br>");
        document.writeln("Greater than or equal to : ", greaterthanorequalto, "<br>");
        document.writeln("Less than : ", lessthan, "<br>");
        document.writeln("Less than or equal to : ", lessthanorequalto, "<br>");
    </script>
</body>

</html>
