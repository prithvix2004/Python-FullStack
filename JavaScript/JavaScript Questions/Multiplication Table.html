<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a number : "));
        var i = 1;
        var mul = 1;
        while (i <= 20) {
            document.writeln(`${a}*${i}=${a * i}`);
            i += 1;
        }
    </script>
</body>

</html>
