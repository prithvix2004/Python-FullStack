<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>JavaScript Date (Demo)</title>
</head>

<body>
       <script>
              var date = new Date();
              var day = date.getDate();
              var month = date.getMonth() + 1;
              var year = date.getFullYear();
              document.writeln("<br>Date is : " + day + "/" + month + "/" + year);
       </script>
</body>

</html>
