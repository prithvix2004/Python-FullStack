<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area and Perimeter of Circle</title>
</head>

<body>
    <script>
        var r = parseInt(prompt("Enter radius : "));
        var area = 3.14 * r * r;
        var perimeter = 2 * 3.14 * r;
        document.writeln("Area", area, "<br>");
        document.writeln("Perimeter", perimeter, "<br>");
    </script>
</body>

</html>
