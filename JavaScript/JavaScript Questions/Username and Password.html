<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username and Password</title>
</head>

<body>
    <script>
        var username = prompt("Enter Username : ");
        var password = prompt("Enter Password : ");
        var u = "user";
        var p = "pass";
        if (username == u && password == p) {
            if (username != u && password != p) {
                document.writeln("Invalid Username and Password..");
            }
            else {
                document.writeln("Valid Username and Password..");
            }
        }
        else if (username != u && password == p) {
            if (password != p) {
                document.writeln("Invalid Password..");
            }
            else {
                document.writeln("Valid Password..");
            }
        }
        else if (username == u && password != p) {
            if (username != u) {
                document.writeln("Invalid Username..");
            }
            else {
                document.writeln("Valid Username..")
            }
        }
    </script>
</body>

</html>
