<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operators (using Switch Statement)</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a :"));
        var b = parseInt(prompt("Enter b :"));
        var Operators = parseInt(prompt("Enter operator :"));
        var result;
        switch (Operators) {
            case '+': result = a + b; break;
            case '-': result = a - b; break;
            case '*': result = a * b; break;
            case '/': result = a / b; break;
            case '%': result = a % b; break;
            default: result = "Invalid";
        }
        document.writeln("Arithmetic Operators");
        document.writeln("Value of a is : ", `${a}`, "<br>Value of b is : `${b}`<br> ",Result, "'${a}${Operators}${b}=${result}`);
    </script>
</body>

</html>
