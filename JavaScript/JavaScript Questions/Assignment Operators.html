<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a number : "));
        a += 20;
        document.writeln("Add and Assign : ", a, "<br>");
        a -= 20;
        document.writeln("Subtract and Assign : ", a, "<br>");
        a *= 20;
        document.writeln("Multiply and Assign : ", a, "<br>");
        a /= 20;
        document.writeln("Divide and Assign : ", a, "<br>");
        a %= 20;
        document.writeln("Modulus and Assign : ", a, "<br>");
    </script>
</body>

</html>
