<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product of Ten Numbers</title>
</head>

<body>
    <script>
        var i = 1;
        var product = 1;
        while (i <= 10) {
            product *= 1;
            i += 1;
        }
    </script>
</body>

</html>
