<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a number : "));
        var b = parseInt(prompt("Enter a number : "));
        var add = a + b;
        var sub = a - b;
        var mul = a * b;
        var div = a / b;
        var mod = a % b;
        var inc = a++;
        var dec = a--;
    </script>
</body>

</html>
