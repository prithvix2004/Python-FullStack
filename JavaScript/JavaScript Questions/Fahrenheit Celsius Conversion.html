<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahrenheit to Celsius Conversion</title>
</head>

<body>
    <script>
        var f = parseFloat(prompt("Enter Celsius : "));
        var c = (f - 32) * (5 / 9);
        document.writeln("Celsius : ", c, "<br>");
    </script>
</body>

</html>
