<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Multiplication Table Demo</title>
</head>

<body>
       <script>
              var a = parseInt(prompt("Enter a number : "));
              var i = 1;
              var mul = 1;
              while (i <= 10){
                     document.writeln(`${a} x ${i}= ${a*i}<br>`);
                      i += 1;
              }
       </script>
</body>

</html>
