<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>JavaScript Events dblclick Event</title>
</head>

<body>
       <h1 id="heading" ondblclick="fun()">Greetings</h1>
       <h2>Double click the text "Greetings" to see the effect.</h2>
       <p>This is an example of using ondblclick attribute.</p>
</body>
<script>
       function fun() {
              document.getElementById("heading").innerHTML = "Welcome to G - Tec Education";
       }
</script>

</html>
