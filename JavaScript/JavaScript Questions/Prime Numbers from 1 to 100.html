<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Numbers from 1 to 100</title>
</head>

<body>
    <script>
        var i = 1;
        while (i <= 100) {
            var j = 1;
            var count = 0;
            while (j <= i) {
                if (i % j == 0) {
                    count++;
                }
                j++;
            }
            if (count == 2) {
                document.writeln(i, "<br>");
            }
            i++;
        }
    </script>
</body>

</html>
