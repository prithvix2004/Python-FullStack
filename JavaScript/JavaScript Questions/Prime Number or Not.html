<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime or Not</title>
</head>

<body>
    <script>
        var a = parseInt(prompt("Enter a number :"));
        var i = 1;
        while (i <= a) {
            if (a % i == 0) {
                count += 1;
            }
            i++;
        }
        if (count == 2) {
            document.writeln("Number is Prime..");
        }
        else {
            document.writeln("Number is not Prime");
        }
    </script>
</body>

</html>
