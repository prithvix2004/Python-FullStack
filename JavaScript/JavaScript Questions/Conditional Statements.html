<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>

<body>
    <script>
        var x = 100;
        var y = 100;
        if (x > y) {
            document.writeln("x is greater than y.");
        }
        else if (x == y) {
            document.writeln("x is equal to y.");
        }
        else {
            document.writeln("x is less than y.");
        }
    </script>
</body>

</html>
