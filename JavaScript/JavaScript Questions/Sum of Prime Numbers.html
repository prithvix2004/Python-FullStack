<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Prime Numbers</title>
</head>

<body>
    <script>
        var i = 1;
        var sum = 0;
        while (i <= 100) {
            var j = 1;
            var count = 0;
            while (j <= i) {
                if (i % j == 0) {
                    count++;
                }
                j++;
            }
            if (count == 2) {
                sum += i;
            }
            i++;
        }
        document.writeln(sum, "<br>");
    </script>
</body>

</html>
